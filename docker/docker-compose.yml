# ============================================
# ARISP – Docker Compose (Development)
# Usage: docker compose up --build
#
# Mỗi service khai báo cả `image:` lẫn `build:`:
#   - Dev  : `docker compose up --build` → build tại chỗ, gắn tag :dev
#   - Prod : `IMAGE_TAG=<sha> docker compose ... pull && up -d` → kéo image
#            GitHub Actions đã build sẵn trên GHCR, KHÔNG build trên VPS
#            (VPS 3.8GB RAM không kham nổi 2 bản Vite build + .NET + Python).
# ============================================

services:
  # --- ASP.NET Core Backend ---
  backend:
    image: ghcr.io/quannguyendz/arisp-backend:${IMAGE_TAG:-dev}
    build:
      context: ../ari-service
      dockerfile: ../docker/backend/Dockerfile
      target: development
    container_name: arisp-backend
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:5000
      # ADR-039: chọn RAG microservice Python. Đặt AI_PROVIDER=rag để dùng service Python.
      - RAG_SERVICE_URL=http://rag-service:8000
    volumes:
      - ../ari-service:/app/src
      - /app/src/src/ARI.API/obj
      - /app/src/src/ARI.API/bin
      - /app/src/src/ARI.Application/obj
      - /app/src/src/ARI.Domain/obj
      - /app/src/src/ARI.Infrastructure/obj
    depends_on:
      # Backend chạy EF migrations lúc boot (AriDbContextInitialiser) nên phải đợi
      # Postgres nhận kết nối. Quan trọng nhất ở lần deploy đầu: initdb trên thư mục
      # rỗng lâu hơn cửa sổ retry ~9 giây (3 lần × 3s) của initialiser.
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rag-service:
        condition: service_started
    networks:
      - arisp-network
    restart: unless-stopped

  # --- RAG Interview Microservice (Python / FastAPI + LangChain) — ADR-039 ---
  # Nội bộ: KHÔNG route qua Nginx. Backend gọi qua http://rag-service:8000.
  rag-service:
    image: ghcr.io/quannguyendz/arisp-rag:${IMAGE_TAG:-dev}
    build:
      context: ../rag-service
      dockerfile: ../docker/rag/Dockerfile
      target: development
    container_name: arisp-rag
    ports:
      - "8000:8000"   # expose ra host chỉ để dev/test Swagger; prod gỡ bỏ nếu muốn
    env_file:
      - .env
    volumes:
      - ../rag-service:/app
    networks:
      - arisp-network
    restart: unless-stopped

  # --- React Frontend: Candidate site (public) ---
  frontend-candidate:
    image: ghcr.io/quannguyendz/arisp-candidate:${IMAGE_TAG:-dev}
    build:
      context: ../ari-web
      dockerfile: ../docker/frontend/Dockerfile
      target: development
      args:
        PKG: "@ari/candidate-site"
        SITE: ARI.CandidateSite
        PORT: "3000"
    container_name: arisp-frontend-candidate
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - ../ari-web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - arisp-network
    restart: unless-stopped

  # --- React Frontend: Staff site (nội bộ) ---
  frontend-staff:
    image: ghcr.io/quannguyendz/arisp-staff:${IMAGE_TAG:-dev}
    build:
      context: ../ari-web
      dockerfile: ../docker/frontend/Dockerfile
      target: development
      args:
        PKG: "@ari/staff-site"
        SITE: ARI.StaffSite
        PORT: "3001"
    container_name: arisp-frontend-staff
    ports:
      - "3001:3001"
    env_file:
      - .env
    volumes:
      - ../ari-web:/app
      - /app/node_modules
    depends_on:
      - backend
    networks:
      - arisp-network
    restart: unless-stopped

  # --- Redis Cache ---
  redis:
    image: redis:7-alpine
    container_name: arisp-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arisp-network
    restart: unless-stopped

  # --- Nginx Reverse Proxy ---
  nginx:
    image: nginx:1.27-alpine
    container_name: arisp-nginx
    ports:
      - "80:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d:/etc/nginx/conf.d:ro
      - ../nginx/snippets:/etc/nginx/snippets:ro
    depends_on:
      - backend
      - frontend-candidate
      - frontend-staff
    networks:
      - arisp-network
    restart: unless-stopped

  # --- PostgreSQL + pgvector (dev VÀ production — xem ADR-055) ---
  # Trước đây prod chạy trên Supabase và container này chỉ dùng cho dev/test.
  # Nay đây là DB production: mật khẩu lấy từ .env, dữ liệu nằm ở bind mount,
  # cổng ra host do docker-compose.prod.yml quyết định (chỉ 127.0.0.1).
  postgres:
    image: pgvector/pgvector:pg17
    container_name: arisp-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      # Default chỉ dành cho máy dev. Prod BẮT BUỘC đặt POSTGRES_PASSWORD trong .env.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password123}
      POSTGRES_DB: ${POSTGRES_DB:-arisp_db}
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-arisp_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    # Bind mount thay cho named volume: `docker compose down -v` KHÔNG xoá được
    # dữ liệu production, và biết chính xác đường dẫn để pg_dump/snapshot.
    # Dev trên Windows/macOS đặt PGDATA_PATH=./pgdata trong .env nếu muốn.
    volumes:
      - ${PGDATA_PATH:-/var/lib/arisp/pgdata}:/var/lib/postgresql/data
    # Mặc định /dev/shm của Docker là 64MB — không đủ cho truy vấn song song
    # trên bảng lớn (Postgres báo "could not resize shared memory segment").
    shm_size: 256mb
    networks:
      - arisp-network
    restart: unless-stopped

networks:
  arisp-network:
    driver: bridge

volumes:
  redis-data:
  # postgres-data đã bỏ: dữ liệu Postgres chuyển sang bind mount ${PGDATA_PATH}
  # để không bị `docker compose down -v` xoá mất. Volume cũ trên VPS vẫn còn —
  # phải copy/restore dữ liệu sang bind mount trước khi xoá nó (ADR-055).
