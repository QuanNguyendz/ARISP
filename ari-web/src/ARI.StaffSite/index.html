<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/arisp.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5.0" />
    <meta name="description" content="ARISP Staff — nội bộ (HR, Recruiter, Super Admin)" />
    <title>ARISP Staff</title>
    <!-- Áp theme đã lưu TRƯỚC khi React render để không nháy màu. Khoá 'theme' nhận
         'light' | 'dark' | 'system'; chưa chọn gì thì mặc định là SÁNG. -->
    <script>
      (function () {
        var dark = false;
        try {
          var t = localStorage.getItem('theme');
          dark =
            t === 'dark' ||
            (t === 'system' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          dark = false;
        }
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
