# ============================================================
# ARISP – Nginx Site Config (host-based, 2 SPA)
#
#   localhost        → Candidate site (public)  → frontend-candidate:3000
#   staff.localhost  → Staff site (nội bộ)       → frontend-staff:3001
#
# Host-based (không path-prefix) vì cả 2 SPA đều có /auth/* và /assets/* trùng path;
# chỉ tách theo host mới giữ được URL byte-for-byte cho mỗi origin (ADR-046).
# Cả 2 origin share chung /api/, /hubs/, /uploads/ (cùng backend).
#
# Dev (HTTP):  2 block "Development" bên dưới đang active
# Prod (HTTPS): xem block mẫu ở cuối; thay domain thật + bật SSL
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── Development: Candidate site (public) ─────────────────────────────────────
server {
    listen 80;
    server_name localhost;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Host              $host;
    proxy_redirect   off;

    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection keep-alive;
    }

    location /hubs/ {
        proxy_pass         http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000/uploads/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass         http://frontend-candidate:3000/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# ─── Development: Staff site (nội bộ) ─────────────────────────────────────────
# Truy cập http://staff.localhost (trình duyệt hiện đại tự phân giải *.localhost → 127.0.0.1;
# nếu không, thêm dòng "127.0.0.1 staff.localhost" vào file hosts).
server {
    listen 80;
    server_name staff.localhost;

    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header Host              $host;
    proxy_redirect   off;

    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Connection keep-alive;
    }

    location /hubs/ {
        proxy_pass         http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000/uploads/;
        proxy_http_version 1.1;
    }

    location / {
        proxy_pass         http://frontend-staff:3001/;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade    $http_upgrade;
        proxy_set_header   Connection $connection_upgrade;
    }
}

# ─── Production (HTTPS) ───────────────────────────────────────────────────────
# Khi deploy HTTPS:
#   1. Comment 2 block "Development" bên trên
#   2. Bỏ comment các block bên dưới, thay domain thật:
#        candidate.yourdomain.com  (hoặc apex yourdomain.com) → frontend-candidate:3000
#        staff.yourdomain.com                                 → frontend-staff:3001
#   3. Bật ssl_certificate trong docker-compose.prod.yml
#   4. Google Cloud Console: URI callback vẫn trỏ backend
#        https://api.yourdomain.com/api/auth/external/google-callback  (không đổi)
#   5. appsettings.Production.json:
#        Authentication:AdminFrontendUrl   = https://staff.yourdomain.com
#        Frontend:CandidateBaseUrl         = https://yourdomain.com

