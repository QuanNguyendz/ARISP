# ============================================================
# ARISP – Nginx Site Config (PRODUCTION, host-based 2 SPA)
#
#   arisp.io.vn        → Candidate site (public)  → frontend-candidate:3000
#   staff.arisp.io.vn  → Staff site (nội bộ)      → frontend-staff:3001
#
# Thư mục này CHỈ dùng ở production: docker-compose.prod.yml mount
# ../nginx/conf.d.prod vào /etc/nginx/conf.d (thay cho ../nginx/conf.d bản dev).
# Nhờ vậy config prod nằm trong git thay vì phải sửa tay trên VPS — trước đây
# nginx/conf.d/arisp.conf bị chỉnh trực tiếp trên server và `git reset --hard`
# sẽ xoá mất.
#
# Host-based (không path-prefix) vì cả 2 SPA đều có /auth/* và /assets/* trùng
# path; chỉ tách theo host mới giữ được URL byte-for-byte mỗi origin (ADR-046).
# Cả 2 origin share chung /api/, /hubs/, /uploads/ (cùng backend).
#
# Cert dùng chung 1 chứng chỉ phủ cả 3 tên (arisp.io.vn, www, staff):
#   certbot --expand -d arisp.io.vn -d www.arisp.io.vn -d staff.arisp.io.vn
# ============================================================

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ─── HTTP → HTTPS cho mọi host ────────────────────────────────────────────────
server {
    listen 80;
    server_name arisp.io.vn www.arisp.io.vn staff.arisp.io.vn;
    return 301 https://$host$request_uri;
}

# ─── Candidate site (public) ──────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name arisp.io.vn www.arisp.io.vn;

    ssl_certificate     /etc/letsencrypt/live/arisp.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arisp.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # CV/JD upload — mặc định nginx chỉ cho 1M, không đủ cho PDF/DOCX.
    client_max_body_size 25m;

    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        keep-alive;
    }

    location /hubs/ {
        proxy_pass         http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        # Phiên phỏng vấn im lặng lâu vẫn phải giữ WebSocket sống.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
    }

    location / {
        proxy_pass         http://frontend-candidate:3000/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
    }
}

# ─── Staff site (nội bộ: HR / Recruiter / Super Admin) ────────────────────────
server {
    listen 443 ssl;
    server_name staff.arisp.io.vn;

    ssl_certificate     /etc/letsencrypt/live/arisp.io.vn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/arisp.io.vn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 25m;

    location /api/ {
        proxy_pass         http://backend:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        keep-alive;
    }

    location /hubs/ {
        proxy_pass         http://backend:5000/hubs/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /uploads/ {
        proxy_pass         http://backend:5000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
    }

    location / {
        proxy_pass         http://frontend-staff:3001/;
        proxy_http_version 1.1;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   Host              $host;
    }
}
